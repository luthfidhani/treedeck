# On every push to main (i.e. a merged PR): run CI, and if it passes and package.json has a version
# that hasn't been released yet, publish a GitHub Release with the .vsix. Bump the version in a PR to release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.ci.outputs.version }}
    steps:
      - name: Skip if this version is already released
        id: check
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Bump the version in package.json to publish a new one."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download .vsix
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: treedeck-vsix

      # Creates the tag on the exact commit CI tested.
      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "$TAG" ./*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TreeDeck $TAG" \
            --generate-notes
